<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url(fonts/plex-Regular.woff) format("woff")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-display:swap;src:url(fonts/plex-Medium.woff) format("woff")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-display:swap;src:url(fonts/plex-Bold.woff) format("woff")}
@font-face{font-family:Amiri;font-weight:700;font-display:swap;src:url(fonts/amiri-Bold.woff) format("woff")}
:root{
  --ink:#1f2d33; --muted:#66757b; --line:#dde4e6; --bg:#f6f4ee; --card:#fff;
  --teal:#1f4e5f; --teal2:#2c6a7d; --gold:#b8901c; --gold-bg:#fbf4dc;
  --m:#2f6d93; --m-bg:#e9f2f8; --f:#a4466f; --f-bg:#fbedf3; --u-bg:#f1f1ef;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}
header{background:var(--teal);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.hwrap{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:Amiri,serif;font-size:26px;text-decoration:none;color:#f5e6b0;white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:#dbe8ec;text-decoration:none;padding:5px 11px;border-radius:999px;font-size:14px}
nav a.on,nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.searchbox{position:relative;flex:1;min-width:200px}
#tabbar,#moresheet{display:none}
@media(max-width:700px){
  header{position:sticky;top:0}
  .hwrap{gap:8px;padding:6px 14px;min-height:44px}
  .brand{font-size:24px}
  #nav{display:none}
  #topsearch{display:none!important;width:100%;flex-basis:100%}
  header.searching #topsearch{display:block!important}
  .searchbox input{padding:9px 12px}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  #tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -4px 16px rgba(31,78,95,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #tabbar a,#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;font:inherit;font-size:11.5px;
    color:var(--muted);text-decoration:none;background:none;border:0;border-radius:12px;cursor:pointer}
  #tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #tabbar .on{color:var(--teal);font-weight:700}
  #tabbar .on svg{stroke-width:2.3}
  #moresheet.open{display:block;position:fixed;inset:0;z-index:30;background:rgba(20,40,48,.35)}
  #moresheet .sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:up .2s ease;touch-action:pan-x}
  #moresheet .sheet.drag{transition:none}
  #moresheet .sheet.back{transition:transform .2s ease}
  #moresheet .sheet a{display:block;padding:14px 8px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px}
  #moresheet .sheet a:last-child{border:0}
  #moresheet .grab{width:40px;height:4px;border-radius:2px;background:#d5dde0;margin:2px auto 6px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
main.fade{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip:active,.tcard:active,.bcard:active,.btn:active,#tabbar a:active,#tabbar button:active{transform:scale(.97)}
.searchbox input{width:100%;padding:9px 14px;border-radius:10px;border:0;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.results{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none;color:var(--ink)}
.results.show{display:block}
.results button{display:block;width:100%;text-align:right;border:0;background:none;padding:9px 14px;font:inherit;cursor:pointer;border-bottom:1px solid #f0f2f3}
.results button:hover,.results button.act{background:#f2f7f8}
.rnote{padding:8px 14px;font-size:13px;color:var(--muted);background:#fafbfb}
.results small{color:var(--muted);display:block;font-size:12px}
main{max-width:1000px;margin:auto;padding:22px 16px 60px}
h1{font-family:Amiri,serif;font-size:34px;margin:0 0 4px;color:var(--teal)}
h2{font-size:19px;margin:28px 0 10px;color:var(--teal)}
.lead{color:var(--muted);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;color:var(--teal)}
.stat span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.4px solid;border-radius:9px;padding:4px 11px;font-size:14.5px;text-decoration:none;cursor:pointer;background:#fff;line-height:1.5}
.chip.m{border-color:var(--m);background:var(--m-bg)}
.chip.f{border-color:var(--f);background:var(--f-bg)}
.chip.u{border-color:#aaa;background:var(--u-bg)}
.chip.dash{border-style:dashed;color:var(--muted);cursor:default;background:#fff}
.chip.hl{box-shadow:0 0 0 2.5px var(--gold)}
.chip:hover:not(.dash){filter:brightness(.96)}
.sym{color:#6a7a80;font-size:.9em}
.dead{color:#5f6a6e;font-weight:500;font-size:.85em}
.deadfull{font-size:.45em;color:#6b777b;font-weight:500;vertical-align:middle}
.chip.m.dd,.chip.f.dd,.chip.u.dd{border-color:#97a2a6;background:#eceeee}
.grouplbl{font-size:13px;color:var(--muted);margin:10px 0 6px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{text-decoration:none;color:var(--teal2)}
.crumbs a:hover{text-decoration:underline}
.pcard{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;flex:none;border:2px solid}
.avatar.m{background:var(--m-bg);border-color:var(--m);color:var(--m)}
.avatar.f{background:var(--f-bg);border-color:var(--f);color:var(--f)}
.avatar.u{background:var(--u-bg);border-color:#aaa;color:#888}
.pname{font-size:28px;font-weight:700;margin:0}
.full{color:var(--muted);font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fact{background:#f3f5f5;border-radius:8px;padding:3px 10px;font-size:13.5px}
.fact.warn{background:var(--gold-bg);color:#6b5414}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.pname{font-size:23px}h1{font-size:28px}}
.mini{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0}
.mini .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mini .vline{width:1.5px;height:18px;background:#9fb0b5}
.mini .me{font-size:17px;font-weight:700;padding:7px 16px;box-shadow:0 0 0 2.5px var(--gold)}
.tree ul{list-style:none;margin:0;padding-right:20px;border-right:1.5px solid #cdd7da}
.tree>ul{padding-right:0;border:0}
.tree li{margin:4px 0;position:relative}
.tree li>.ln{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tog{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;line-height:1;color:var(--teal);flex:none}
.tog.ph{visibility:hidden}
.cnt{font-size:12px;color:var(--muted)}
.alsonote{font-size:12px;color:var(--gold)}
.relform{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
@media(max-width:700px){.relform{grid-template-columns:1fr}}
.pick label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.pick .searchbox input{border:1px solid var(--line)}
.pick .sel{margin-top:6px;min-height:34px}
.amp{font-size:22px;color:var(--gold);text-align:center;padding-bottom:6px}
.verdict{font-size:20px;font-weight:700;color:var(--teal);margin:4px 0 12px}
.path{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.path .col{display:flex;flex-direction:column-reverse;align-items:center;gap:0}
.path .arrow{color:#9fb0b5;font-size:14px;line-height:1.2}
.apex{text-align:center;margin-bottom:6px}
ol.miss{padding-right:20px}
ol.miss li{margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;color:var(--muted);align-items:center}
footer{max-width:1000px;margin:auto;padding:0 16px 30px;color:var(--muted);font-size:13px;text-align:center}
.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;border-radius:10px;padding:8px 16px;font-size:14.5px;border:0;cursor:pointer;font:inherit}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.hero{background:linear-gradient(160deg,#1f4e5f 0%,#2a6476 100%);color:#fff;border-radius:18px;padding:26px 22px 20px;margin:0 0 22px;position:relative;box-shadow:0 10px 30px rgba(31,78,95,.18)}
.hero-in{display:flex;align-items:center;gap:18px;justify-content:space-between}
.hero-t{font-family:Amiri,serif;font-size:46px;line-height:1.15;color:#f5e6b0;margin:0}
.hero-sub{margin:6px 0 0;color:#dbe8ec;font-size:16px}
.hero-hi{margin:4px 0 0;color:#f5e6b0;font-size:15px}
.hero-hi a{color:#f5e6b0}
.hero-art{flex:none;width:150px;height:auto;opacity:.95}
.hero-search{margin-top:18px;max-width:none}
.hero-search input{padding:14px 18px;font-size:17px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.hero-links{margin-top:14px;font-size:14.5px;color:#a9c3cb;display:flex;gap:6px 14px;flex-wrap:wrap}
.hero-links a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
.askme{margin-top:14px;background:#fff;color:var(--ink);border-radius:14px;padding:14px 16px}
.askme b{font-size:17px;color:var(--teal)}
.askme p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.askme .chips{margin-top:10px}
@media(max-width:560px){.hero{padding:22px 16px 16px;border-radius:16px}.hero-t{font-size:38px}.hero-art{width:96px}}
@media(max-width:700px){.hero-links{display:none}}
.tview{animation:tin .28s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tpath{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px}
.tpath a{color:var(--teal2);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.thead{border:2px solid;border-radius:16px;padding:14px 16px;text-align:center;max-width:460px;margin:0 auto;background:#fff}
.thead.m{border-color:var(--m);background:var(--m-bg)}.thead.f{border-color:var(--f);background:var(--f-bg)}
.thead.dd{border-color:#97a2a6;background:#eceeee}
.thn{font-size:24px;font-weight:700}
.ths{font-size:13px;color:var(--muted)}
.thc{font-size:13.5px;margin-top:4px;color:var(--ink)}
.thead .chips{justify-content:center;margin-top:10px}
.btn.sm{padding:5px 12px;font-size:13.5px}
.tvline{width:2px;height:22px;background:#c4cfd2;margin:0 auto}
.tgroup{border-top:2px solid #c4cfd2;padding-top:12px;margin-top:0}
.tgroup+.tgroup{margin-top:14px}
.tglbl{text-align:center;font-size:13px;color:var(--muted);margin:-4px 0 8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1.5px solid;border-radius:12px;padding:10px 12px;background:#fff;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.tcard.m{border-color:var(--m);background:var(--m-bg)}.tcard.f{border-color:var(--f);background:var(--f-bg)}
.tcard.dd{border-color:#97a2a6;background:#eceeee}
.tcard.leaf{border-style:dashed;opacity:.85}
.tcard.bc{border-top:5px solid var(--bc)}
.bcard.bc:before{background:var(--bc)}
.bdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bc);margin-inline-end:6px;vertical-align:middle}
.fact.branch{background:color-mix(in srgb,var(--bc) 14%,#fff);color:var(--ink)}
.fact.branch a{text-decoration:none;font-weight:600}
.avatar.bc{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--bc)}
.hometree{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.hometree .htop{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.hometree .hsibs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.hometree .hmore{display:flex;justify-content:center;margin-top:14px}
.hometree .hnote{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0}
#a2hs{display:none;margin:18px 0;background:var(--gold-bg);border:1px solid #ecd9a0;border-radius:14px;padding:12px 14px;font-size:14.5px}
#a2hs.show{display:block}
#a2hs b{color:var(--teal)}
#a2hs .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
::view-transition-group(*){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root){animation:vtout .16s ease both}
::view-transition-new(root){animation:vtin .26s ease both}
::view-transition-new(tkids){animation:vtkids .34s cubic-bezier(.2,.8,.2,1) both}
::view-transition-old(tkids){animation:vtout .14s ease both}
@keyframes vtin{from{opacity:0}}
@keyframes vtout{to{opacity:0}}
@keyframes vtkids{from{opacity:0;transform:translateY(26px)}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.tcard .tn{font-weight:700;font-size:16px}
.tcard .ts{font-size:12px;color:var(--muted);line-height:1.5}
.tcard .tk{font-size:12.5px;color:var(--teal);margin-top:auto;padding-top:4px}
.tcard.leaf .tk{color:var(--muted)}
@media(max-width:560px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:box-shadow .15s,transform .15s}
.bcard:hover{box-shadow:0 6px 18px rgba(31,78,95,.12);transform:translateY(-1px)}
.bcard:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--gold)}
.bcard .bn{font-size:19px;font-weight:700;color:var(--teal)}
.bcard .bs{font-size:13px;color:var(--muted);margin-top:2px}
.bcard .bnum{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
.bcard .bnum b{display:block;font-size:20px;color:var(--ink)}
.bcard .bkids{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6}
.news{border-right:4px solid var(--gold)}
.news ul{margin:4px 0 0;padding-right:18px}
.news li{margin:3px 0}
.news .nd{font-size:12.5px;color:var(--muted);margin-top:8px}
.bpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bpick a{text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--teal)}
.bpick a.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.bpick a small{color:inherit;opacity:.7;margin-right:4px}
.askbox{margin-top:10px;background:#fff8e6;border:1px dashed #d8b85a;border-radius:10px;padding:8px 12px;font-size:14px}
.askbox a{color:var(--teal);font-weight:700}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:8px;font-size:14px}
.bar a{color:var(--teal);text-decoration:none}
.bar .tr{background:#eef2f3;border-radius:6px;height:14px;overflow:hidden}
.bar .fl{background:var(--teal2);height:100%;border-radius:6px}
.bar .v{text-align:left;color:var(--muted);font-size:13px}
.rank{counter-reset:r;list-style:none;padding:0;margin:0}

.rank li:before{content:counter(r, arabic-indic);color:var(--gold);font-weight:700;width:22px}
.rank li span:first-of-type{flex:1}
.rank .v{color:var(--muted);font-size:13px}
h1.pname{font-family:inherit;color:var(--ink)}
#mebar .mewrap{max-width:1000px;margin:auto;padding:8px 16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#mebar .meline{background:var(--gold-bg);border-bottom:1px solid #ecdca6;color:var(--ink)}
#mebar .meline a{color:var(--teal);font-weight:700;text-decoration:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--teal2);text-decoration:underline;cursor:pointer}
.mechoose{max-width:1000px;margin:16px auto 0;padding:0 16px}
.mechoose .panel{border:1.5px solid var(--gold);background:var(--gold-bg);margin:0}
.mechoose h2{margin:0 0 4px;font-size:19px;color:var(--teal)}
.mechoose p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.mechoose .row2{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mechoose .searchbox{max-width:420px}

.ebtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ebtns button{font:inherit;font-size:16px;padding:13px 10px;border-radius:12px;border:1px solid #9cc5ae;background:#fff;color:var(--teal);cursor:pointer;font-weight:500}

}

// ---------- بحث
// تطبيع الكتابة: الهمزات، الياء والألف المقصورة، التاء المربوطة، التشكيل، المسافات، و"بن/بنت"
function norm(s){
  return String(s || "").replace(/[ً-ْٰـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ء/g, "")
    .replace(/ى/g, "ي").replace(/ة/g, "ه")
    .split(/\s+/).filter(w => w && !["بن","ابن","بنت","ابنه","بنه","ولد"].includes(w)).join("");
}
function editDist(a, b){ // مسافة التحرير (لأخطاء الكتابة البسيطة)
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const SKEY = {};
function skeys(p){ // الاسم مع نسبه من جهة الأب، ومن جهة الأم
  if (SKEY[p.id]) return SKEY[p.id];
  const viaMother = p.mother && P[p.mother] ? norm(p.name) + norm(lineage(P[p.mother])) : "";
  return SKEY[p.id] = {name: norm(p.name), line: norm(lineage(p)), mline: viaMother, alias: norm(p.alias || "")};
}
const MAXR = 8;
const nRes = n => n === 2 ? "نتيجتان" : `${AR(n)} ${n >= 3 && n <= 10 ? "نتائج" : "نتيجة"}`;
function searchList(q){
  q = norm(q);
  if (!q) return {items: [], more: 0};
  const scored = [];
  DATA.people.forEach(p => {
    const k = skeys(p); let s = -1;
    if (k.name === q || (k.alias && k.alias === q)) s = 0;          // الاسم نفسه أو لقبه
    else if (k.line.startsWith(q) || k.mline.startsWith(q)) s = 1;   // الاسم ثم الأب ثم الجد…
    else if (k.name.startsWith(q) || (k.alias && k.alias.startsWith(q))) s = 2;   // بداية الاسم أو اللقب
    else if (q.length >= 3 && (k.line.includes(q) || k.mline.includes(q))) s = 3;
    if (s >= 0) scored.push({p, s, len: k.line.length});
  });
  if (!scored.length && q.length >= 3) { // لا نتائج: نجرب التسامح مع خطأ كتابة بسيط
    const tol = q.length >= 8 ? 2 : 1;
    DATA.people.forEach(p => { const k = skeys(p);
      const dd = Math.min(...[k.line, k.mline].filter(Boolean).map(l => editDist(q, l.slice(0, q.length))),
                          ...[k.line, k.mline].filter(Boolean).map(l => editDist(q, l.slice(0, q.length + 1))),
                          ...[k.line, k.mline].filter(Boolean).map(l => editDist(q, l.slice(0, Math.max(q.length - 1, 1)))));
      if (dd <= tol) scored.push({p, s: 4 + dd, len: k.line.length}); });
  }
  scored.sort((x, y) => x.s - y.s || x.len - y.len);
  // إن وُجد من يبدأ اسمه بما كُتب، لا نعرض من يرد الاسم في نسبه فقط
  if (scored.length && scored[0].s <= 2) scored.splice(0, scored.length, ...scored.filter(x => x.s <= 2));
  return {items: scored.slice(0, MAXR).map(x => x.p), more: Math.max(0, scored.length - MAXR), fuzzy: scored.length && scored[0].s >= 4};
}
function wireSearch(box, onPick){
  const inp = box.querySelector("input"), res = box.querySelector(".results");
  let items = [], more = 0, fuzzy = false;
  const live = document.getElementById("live");
  const draw = () => {
    res.innerHTML = (fuzzy ? `<div class="rnote">لم نجد الاسم كما كُتب، هل تقصد:</div>` : "") +
      items.map((p,i) => `<button data-i="${i}">${esc(nm(p))} <span aria-hidden="true">${SYM[p.gender]}${p.dead?' (ر)':''}</span><small>${esc(shortName(p,6))}${p.dead ? (isF(p)?"، رحمها الله":"، رحمه الله") : ""}</small></button>`).join("")
      + (more ? `<div class="rnote">وهناك ${AR(more)} غيرهم. اكتب اسم الأب بعد الاسم لتضييق البحث.</div>` : "")
      || (inp.value.trim() ? `<div class="rnote">لا توجد نتائج. اكتب الاسم الأول فقط.</div>` : "");
    res.classList.toggle("show", !!inp.value.trim());
  };
  const say = () => {
    if (!inp.value.trim()) { live.textContent = ""; return; }
    if (!items.length) { live.textContent = "لا توجد نتائج"; return; }
    const n = items.length + more;
    live.textContent = (fuzzy ? "لم نجد الاسم كما كُتب، وهناك أسماء قريبة. " : "") +
      (n === 1 ? `نتيجة واحدة: ${shortName(items[0], 5)}.` : `${nRes(n)}` + (more ? "، اكتب اسم الأب لتضييق البحث." : "."));
  };
  let t;
  inp.addEventListener("input", () => { ({items, more, fuzzy} = searchList(inp.value)); draw(); clearTimeout(t); t = setTimeout(say, 350); });
  res.addEventListener("keydown", e => {
    const bs = [...res.querySelectorAll("button[data-i]")], i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { (bs[i+1] || bs[i]).focus(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { i > 0 ? bs[i-1].focus() : inp.focus(); e.preventDefault(); }
    else if (e.key === "Escape") { inp.focus(); res.classList.remove("show"); }
    else if (e.key === "Enter" && i >= 0) { e.preventDefault(); pick(items[i]); }
  });
  res.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) pick(items[+b.dataset.i]); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { const b = res.querySelector("button[data-i]"); if (b) { b.focus(); e.preventDefault(); } }
    else if (e.key === "Enter") {
      e.preventDefault();
      ({items, more, fuzzy} = searchList(inp.value)); draw();
      if (items.length === 1 && !fuzzy) pick(items[0]);          // نتيجة واحدة مؤكدة: تُختار مباشرة
      else if (items.length) { res.querySelector("button[data-i]").focus();   // أكثر من نتيجة: ننقل إلى القائمة ليختار
        live.textContent = `${nRes(items.length + more)}، اختر منها.`; }
      else say();
    }
    else if (e.key === "Escape") { res.classList.remove("show"); }
  });
  box.addEventListener("focusout", () => setTimeout(() => { if (!box.contains(document.activeElement)) res.classList.remove("show"); }, 150));
  function pick(p){ res.classList.remove("show"); onPick(p, inp); }
}

const DESC = {};
function descendants(id){ // كل الذرية المسجلة (بلا تكرار)
  if (DESC[id]) return DESC[id];
  const out = new Set(), st = [...P[id].kids];
  while (st.length) { const k = st.pop(); if (out.has(k)) continue; out.add(k); st.push(...P[k].kids); }
  return DESC[id] = out;
}
function depthOf(p){ let d = 1, q = p; while ((q.father && P[q.father]) || (q.mother && P[q.mother])) { q = P[q.father] || P[q.mother]; d++; } return d; }
function branchGens(id){ const base = depthOf(P[id]); let m = base; descendants(id).forEach(k => m = Math.max(m, depthOf(P[k]))); return m - base + 1; }
const DOCUMENTED = ["1.10", "1.12", "1.11", "1.9", "1.1", "1.5", "1.6", "1.4", "1.2"];
const BCOL = {"1.10":"#2c6a7d","1.12":"#b8901c","1.11":"#5b8c3a","1.9":"#8a5a9e","1.1":"#c0603a","1.5":"#3a7f86","1.6":"#9b4d5f","1.4":"#6b7a2f","1.2":"#4f6aa8"};
const BNEUTRAL = "#97a2a6";
const BR_CACHE = {};
function branchOf(id){ // ابن محمد بشير الذي ينتمي إليه الشخص (ذرية طمبل من فرع عجائب)
  if (id in BR_CACHE) return BR_CACHE[id];
  let q = P[id], r = null;
  while (q) {
    if (q.id === "0.2.1") { r = "1.4"; break; }
    if (q.father === MAIN || (q.mother === MAIN)) { r = q.id; break; }
    q = upParent(q);
  }
  return BR_CACHE[id] = r;
}

// ---------- صلة القرابة
const REL = {a: null, b: null};
function ancestors(id){ // BFS: ancestor -> {d, next}
  const m = new Map([[id, {d:0, next:null}]]); const q = [id];
  while (q.length) { const x = q.shift(); const p = P[x];
    [p.father, p.mother].forEach(par => { if (par && P[par] && !m.has(par)) { m.set(par, {d: m.get(x).d + 1, next: x}); q.push(par); } }); }
  return m;
}
function chain(m, top){ const out = [top]; let x = top; while (m.get(x).next) { x = m.get(x).next; out.push(x); } return out; } // من الجد نزولاً
// كل طرق الصعود من id إلى أجداده: [id, والد, ..., الجد]
function upPaths(id, depth = 0){
  const p = P[id], out = [[id]];
  if (depth > 12) return out;
  for (const par of [p.father, p.mother]) if (par && P[par])
    for (const path of upPaths(par, depth + 1)) out.push([id, ...path]);
  return out;
}
// الصلات بين a وb: لكل جهة (والد a أو والدته × والد b أو والدته) أقرب جد مشترك تلتقي عنده طريقان لا يشتركان في غيره
function relConnections(a, b){
  const PA = upPaths(a), PB = upPaths(b), byTop = {};
  PB.forEach(q => (byTop[q[q.length - 1]] ||= []).push(q));
  const best = {};
  for (const x of PA) {
    const top = x[x.length - 1];
    for (const y of byTop[top] || []) {
      const sx = new Set(x.slice(0, -1));
      if (y.slice(0, -1).some(n => sx.has(n))) continue;   // يلتقيان قبل هذا الجد
      const key = (x[1] || "") + "|" + (y[1] || "");
      const len = x.length + y.length;
      if (!best[key] || len < best[key].len) best[key] = {len, ca: x.slice().reverse(), cb: y.slice().reverse()};
    }
  }
  const all = Object.values(best).sort((u, v) => u.len - v.len);
  if (!all.length) return all;
  if (all[0].ca.length === 2 && all[0].cb.length === 2) return [all[0]];   // إخوة: لا حاجة لغيرها
  return all.filter(c => c.len <= all[0].len + 1).slice(0, 4);           // الصلات القريبة فقط
}
function relationLabel(a, b, ca, cb){ // ca وcb: من الجد المشترك نزولاً إلى a وb
  const top = ca[0], da = ca.length - 1, db = cb.length - 1;
  const pa = P[a], pb = P[b];
  const ab = (p, mWord, fWord) => isF(p) ? fWord : mWord;
  if (da === 0) { // a جد b
    if (db === 1) return `${pa.name} ${ab(pa,"والد","والدة")} ${pb.name}`;
    return `${pa.name} ${ab(pa,"جد","جدة")} ${pb.name}` + (db > 2 ? ` (من الدرجة ${AR(db-1)})` : "");
  }
  if (db === 0) {
    if (da === 1) return `${pa.name} ${ab(pa,"ابن","بنت")} ${pb.name}`;
    return `${pa.name} ${ab(pa,"حفيد","حفيدة")} ${pb.name}` + (da > 2 ? ` (من الدرجة ${AR(da-1)})` : "");
  }
  if (da === 1 && db === 1) {
        const sf = pa.father && pa.father === pb.father, sm = pa.mother && pa.mother === pb.mother;
    const g1 = pa.group && pb.group && pa.group !== pb.group;
    return `${pa.name} و${pb.name} إخوة` + (sf && sm ? " أشقاء" : sf && !g1 ? "" : sf ? " من الأب" : " من الأم");
  }
  if (da === 1 && db === 2) { // a عم/خال b
    const par = P[cb[1]];
    return `${pa.name} ${isM(par) ? ab(pa,"عم","عمة") : ab(pa,"خال","خالة")} ${pb.name}`;
  }
  if (da === 2 && db === 1) {
    const par = P[ca[1]];
    return `${pb.name} ${isM(par) ? ab(pb,"عم","عمة") : ab(pb,"خال","خالة")} ${pa.name}`;
  }
  // y ابن/بنت (عم/عمة/خال/خالة) x — حيث px والد x وpy والد y وهما إخوة
  const kinW = (px, y, py) => `${ab(y,"ابن","بنت")} ${isM(px) ? (isM(py) ? "عم" : "عمة") : (isM(py) ? "خال" : "خالة")}`;
  const kinOf = (x, px, y, py) => `${kinW(px, y, py)} ${x.name}`;
  if (da === 2 && db === 2) return `${pb.name} ${kinOf(pa, P[ca[1]], pb, P[cb[1]])}`;
  const up = (p, n) => n === 1 ? ab(p,"والد","والدة") : n === 2 ? ab(p,"جد","جدة") : ab(p,"جد","جدة") + ` من الدرجة ${AR(n-1)}`;
  if (da === 1 || db === 1) { // أحدهما أخو جدّ الآخر
    const [x, cy, dy] = da === 1 ? [pa, cb, db] : [pb, ca, da];
    const y = da === 1 ? pb : pa, sib = P[cy[1]];
    return `${x.name} ${ab(x,"أخو","أخت")} ${sib.name}، ${up(sib, dy-1)} ${y.name}`;
  }
  const n = Math.min(da, db) - 1, ord = ["","الأولى","الثانية","الثالثة","الرابعة","الخامسة"][n] || AR(n);
  const meet = `يلتقيان في ${P[top].name}`;
  if (da === db && n === 2) { // والداهما أبناء عم/خال
    const xa = P[ca[da-1]], xb = P[cb[db-1]];
    return `${xb.name} (${ab(xb,"والد","والدة")} ${pb.name}) ${kinW(P[ca[1]], xb, P[cb[1]])} ${xa.name} (${ab(xa,"والد","والدة")} ${pa.name})`;
  }
  if (da === db) return `${pa.name} و${pb.name} أقارب من الدرجة ${ord}: ${meet}`;
  const [old, yng, cold, cyng, dold, dyng] = da < db ? [pa, pb, ca, cb, da, db] : [pb, pa, cb, ca, db, da];
  const anc = P[cyng[dold]];
  if (n === 1) // old وanc أبناء عم/خال مباشرون
    return `${anc.name} (${up(anc, dyng-dold)} ${yng.name}) ${kinOf(old, P[cold[1]], anc, P[cyng[1]])}`;
  return `${old.name} و${anc.name} (${up(anc, dyng-dold)} ${yng.name}) أقارب من الدرجة ${ord}: ${meet}`;
}

  const pa = P[REL.a], pb = P[REL.b];

// صلة X بك (بصيغة المخاطب). ca: من الجد المشترك إليك، cb: إلى X
function youLabel(ca, cb){
  const me = P[ca[ca.length-1]], X = P[cb[cb.length-1]];
  const da = ca.length - 1, db = cb.length - 1;
  const ab = (p, m, f) => isF(p) ? f : m;
  const myPar = P[ca[ca.length-2]];
  const myUp = (a, n) => a.id === ROOT && n > 2 ? "جدك الأكبر" : n === 1 ? ab(a,"والدك","والدتك") : n === 2 ? ab(a,"جدك","جدتك")
    : n === 3 ? `${ab(a,"جد","جدة")} ${ab(myPar,"والدك","والدتك")}` : "من أجدادك";
  const down = (x, n) => n === 1 ? ab(x,"ابن","بنت") : n === 2 ? ab(x,"حفيد","حفيدة") : "من ذرية";
  const kinYou = (myPar, xPar) => isM(myPar) ? (isM(xPar) ? "عمك" : "عمتك") : (isM(xPar) ? "خالك" : "خالتك");
  const kinW = (aPar, xPar) => isM(aPar) ? (isM(xPar) ? "عم" : "عمة") : (isM(xPar) ? "خال" : "خالة");
  if (da === 0) return db === 1 ? ab(X,"ابنك","بنتك") : db === 2 ? ab(X,"حفيدك","حفيدتك") : "من ذريتك";
  if (db === 0) return myUp(X, da);
  if (da === 1 && db === 1) {
    const sf = me.father && me.father === X.father, sm = me.mother && me.mother === X.mother;
    return ab(X,"أخوك","أختك") + (sf && sm ? ab(X," الشقيق"," الشقيقة") : sf ? " من الأب" : " من الأم");
  }
  if (da === 1) { const S = P[cb[1]]; return `${down(X, db-1)} ${ab(S,"أخيك","أختك")} ${S.name}`; }
  if (db === 1) { const A = P[ca[1]]; return da === 2 ? kinYou(A, X) : da === 3 ? `${ab(X,"أخو","أخت")} ${myUp(A, 2)} ${A.name}` : `${ab(X,"أخو","أخت")} ${A.name}، ${myUp(A, da-1)}`; }
  if (da === 2 && db === 2) return `${ab(X,"ابن","بنت")} ${kinYou(P[ca[1]], P[cb[1]])} ${P[cb[1]].name}`;
  if (da === 2) { const C = P[cb[2]]; return `${down(X, db-2)} ${C.name}، ${ab(C,"ابن","بنت")} ${kinYou(P[ca[1]], P[cb[1]])}`; }
  if (db === 2) { const A = P[ca[2]]; return `${ab(X,"ابن","بنت")} ${kinW(P[ca[1]], P[cb[1]])} ${myUp(A, da-2)} ${A.name}`; }
  if (da === 3 && db === 3) { const Y = P[cb[2]]; return `${ab(X,"ابن","بنت")} ${Y.name}، ${ab(Y,"ابن","بنت")} ${kinW(P[ca[1]], P[cb[1]])} ${ab(myPar,"والدك","والدتك")}`; }
  const n = Math.min(da, db) - 1, ord = ["","الأولى","الثانية","الثالثة","الرابعة","الخامسة"][n] || AR(n);
  return `${ab(X,"قريبك","قريبتك")} من الدرجة ${ord}، تلتقيان في ${P[cb[0]].name}`;
}
function meBox(p){

  const conns = relConnections(me, p.id), seen = new Set(lines);
  const rel = [];

// تغيير بيانات شخص (أو من أضافه المعدِّل)، مع المقارنة بالأصل حتى لا يُسجَّل تغيير لم يحدث
function setFields(id, ch){
  const p = P[id], ao = addOp(id);
  if (ao) { Object.assign(ao.v, ch); Object.assign(p, ch); delete SKEY[id]; return; }
  const cur = {}; EFIELDS.forEach(k => cur[k] = p[k]); Object.assign(cur, ch);
  const o0 = ORIG[id], changed = EFIELDS.some(k => (o0[k] || "") !== (cur[k] || ""));
  EDIT.ops = EDIT.ops.filter(o => !(o.t === "edit" && o.id === id));
  EFIELDS.forEach(k => p[k] = o0[k]); delete p.edited; delete SKEY[id];
  if (changed) { const o = {t: "edit", id, v: cur}; EDIT.ops.push(o); applyOp(o); }
}
function removeAdded(id){
  const gone = new Set([id]); let grew = true;
  while (grew) { grew = false; EDIT.ops.forEach(o => { if (o.t === "add" && gone.has(o.parent) && !gone.has(o.id)) { gone.add(o.id); grew = true; } }); }
  EDIT.ops = EDIT.ops.filter(o => !gone.has(o.id) && !(o.t === "add" && gone.has(o.parent)));
  gone.forEach(g => { DATA.people.forEach(q => { q.kids = q.kids.filter(k => k !== g); }); delete P[g]; });
  for (let i = DATA.people.length - 1; i >= 0; i--) if (gone.has(DATA.people[i].id)) DATA.people.splice(i, 1);
}
function setDel(id, on){
  const p = P[id]; if (!p) return;
  if (p.isNew) { if (on) removeAdded(id); return; }
  EDIT.ops = EDIT.ops.filter(o => !(o.t === "del" && o.id === id)); delete p.delReq;
  if (on) { const o = {t: "del", id}; EDIT.ops.push(o); applyOp(o); }
}

// ---------- الزر العائم والشريط العلوي
function renderEditBar(v){
  const bar = document.getElementById("editbar"), fab = document.getElementById("efab");
  const showFab = EDIT.on && EDIT.ops.length && v !== "edits" && v !== "edit";
  fab.hidden = !showFab; document.body.classList.toggle("hasfab", !!showFab);
  if (showFab) fab.innerHTML = `مراجعة وإرسال <span class="fabn">${AR(EDIT.ops.length)}</span>`;
  if (!EDIT.on || v === "edit" || v === "edits") { bar.innerHTML = ""; return; }
  const n = EDIT.ops.length;
  bar.innerHTML = `<div class="eline"><div class="ewrap"><b>التصحيح والإضافة</b>
    <span>${n ? `لديك ${AR(n)} ${n === 1 ? "تغيير" : n === 2 ? "تغييران" : n <= 10 ? "تغييرات" : "تغييراً"} لم ${n === 2 ? "يُرسلا" : "تُرسل"} بعد` : "اضغط «صحّح أو أضف» عند أي شخص"}</span>
    <span style="flex:1"></span>
    <a class="btn ghost" href="#edit">${n ? "المساعدة" : "المساعدة والخروج"}</a></div></div>`;
}

// ---------- صفحة تعديل أسرة: البيانات، ثم الأبناء مجمّعين حسب الزوجة وتحت كل مجموعة «أضف»
function famGroups(p){
  const groups = [], by = {};
  kidsOf(p).forEach(k => {
    const o = isF(p) ? k.father : k.mother;
    const other = o && o !== p.id && P[o] ? o : null;
    const key = other ? "sp:" + other : "g:" + (k.group || "");
    if (!by[key]) { by[key] = {key, other, group: k.group || "", kids: []}; groups.push(by[key]); }
    by[key].kids.push(k);
  });
  groups.forEach(g => g.label = g.other ? (isF(p) ? "من زوجها " : "من زوجته ") + shortName(P[g.other], 3)
    : g.group ? (/^(الأم|الأب|الزوجة|الزوج):/.test(g.group) ? "من " + g.group : "من " + g.group) : (groups.length > 1 ? "أبناء آخرون" : ""));
  return groups;
}
let KSEQ = 0;
function kidRow(k){
  return `<div class="krow ${k.delReq ? "del" : ""}" data-id="${k.id}">
    <span class="ksym ${G[k.gender]}" aria-hidden="true">${SYM[k.gender] || "؟"}</span>
    <input class="kname" value="${esc(k.name)}" aria-label="الاسم">
    <div class="kctl"><label class="kdead"><input type="checkbox" ${k.dead ? "checked" : ""}>(ر)</label>
    <button type="button" class="kdel">${k.delReq ? "تراجع" : "حذف"}</button>
    <a class="kfam" href="${eid(k.id)}">${isF(k) ? "أسرتها" : "أسرته"} ←</a></div>
  </div>`;
}
function newKidRow(gkey){
  const n = ++KSEQ;
  return `<div class="krow new" data-g="${esc(gkey)}">
    <input class="kname" placeholder="اسم الابن أو البنت" aria-label="الاسم">
    <div class="kctl"><div class="seg sm"><label><input type="radio" name="kg${n}" value="ذكر">ابن</label><label><input type="radio" name="kg${n}" value="أنثى">بنت</label></div>
    <label class="kdead"><input type="checkbox">(ر)</label>
    <button type="button" class="kdel kx" aria-label="إزالة السطر">✕</button></div>
  </div>`;
}

      <details class="emore"><summary>تفاصيل أخرى</summary>
        <div class="fld"><label for="ef-alias">اللقب أو الاسم الذي ${isF(p) ? "تُعرف" : "يُعرف"} به</label><input id="ef-alias" value="${esc(p.alias)}"></div>
        <div class="fld"><label>الجنس</label><div class="seg">
          <label><input type="radio" name="ef-g" value="ذكر" ${p.gender === "ذكر" ? "checked" : ""}>ذكر</label>
          <label><input type="radio" name="ef-g" value="أنثى" ${p.gender === "أنثى" ? "checked" : ""}>أنثى</label></div></div>
        <div class="fld"><label for="ef-notes">ملاحظة تظهر في ${isF(p) ? "صفحتها" : "صفحته"}</label><input id="ef-notes" value="${esc(p.notes)}"></div>
      </details>
    </section>
    <section class="panel ef"><h2>${isF(p) ? "أبناؤها" : "أبناؤه"}</h2>
      ${p.unknown ? `<p class="askbox" style="margin:0 0 12px">؟ أبناء لم تُسجَّل أسماؤهم: ${esc(p.unknown)}. إن كنت تعرفهم أضفهم بالأسفل.</p>` : ""}
      <div id="ef-groups">
      ${(groups.length ? groups : [{key: "g:", label: "", kids: []}]).map(g => `<div class="egrp" data-g="${esc(g.key)}">
        ${g.label ? `<div class="grouplbl">${esc(g.label)}</div>` : ""}
        <div class="krows">${g.kids.map(kidRow).join("")}</div>
        <button type="button" class="addk chip">+ أضف ابناً أو بنتاً</button></div>`).join("")}
      </div>
      <button type="button" class="btn ghost" id="ef-wife" style="margin-top:6px">+ ${isF(p) ? "أضف زوجاً آخر وأبناءه" : "أضف زوجة أخرى وأبناءها"}</button>
    </section>
    <section class="panel ef"><div class="fld"><label for="ef-note">ملاحظة لنا عن هذه الأسرة <span class="opt">(اختياري)</span></label>
      <textarea id="ef-note" rows="3" placeholder="أي شيء آخر تريد أن تخبرنا به">${esc(noteOp ? noteOp.text : "")}</textarea></div></section>
    <div class="efsave"><button type="button" class="btn" id="ef-save">حفظ</button>
      <a class="btn ghost" href="${hashOf(id)}" id="ef-back">رجوع دون حفظ</a>
      ${p.isNew ? `<button type="button" class="btn ghost" id="ef-rm" style="color:#9b2c2c">إزالة ${esc(p.name)}</button>`
        : `<button type="button" class="btn ghost" id="ef-del" style="color:#9b2c2c">${p.delReq ? "إلغاء طلب الحذف" : "طلب حذف" + (isF(p) ? "ها" : "ه") + " من الشجرة"}</button>`}</div>
    <p class="emsg" id="ef-st" role="status">${esc(EF_MSG)}</p>`;
  EF_MSG = "";
  let dirty = false;
  app.oninput = () => { dirty = true; };
  const st = document.getElementById("ef-st");
  const err = (t, el) => { st.className = "emsg err"; st.textContent = t; if (el) { el.focus(); el.scrollIntoView({block: "center"}); } return false; };
  const wireRows = root => {
    root.querySelectorAll(".kdel").forEach(b => b.onclick = () => { dirty = true;
      const row = b.closest(".krow");
      if (row.classList.contains("new")) { row.remove(); return; }
      row.classList.toggle("del"); b.textContent = row.classList.contains("del") ? "تراجع" : "حذف"; });
  };
  const addBtn = g => g.querySelector(".addk").onclick = () => {
    const box = g.querySelector(".krows"); box.insertAdjacentHTML("beforeend", newKidRow(g.dataset.g));
    const row = box.lastElementChild; wireRows(row); row.querySelector(".kname").focus(); dirty = true; };
  app.querySelectorAll(".egrp").forEach(addBtn); wireRows(app);
  let WSEQ = 0;
  document.getElementById("ef-wife").onclick = () => {
    const k = "new:" + (++WSEQ);
    document.getElementById("ef-groups").insertAdjacentHTML("beforeend", `<div class="egrp" data-g="${k}">
      <div class="fld"><label>${isF(p) ? "اسم الزوج" : "اسم الزوجة"}</label><input class="wname" placeholder="${isF(p) ? "اسم الزوج" : "اسم الزوجة"}"></div>
      <div class="krows"></div><button type="button" class="addk chip">+ أضف ابناً أو بنتاً</button></div>`);
    const g = document.getElementById("ef-groups").lastElementChild; addBtn(g); g.querySelector(".wname").focus(); dirty = true;
  };
  function save(){
    st.className = "emsg"; st.textContent = "";
    const name = document.getElementById("ef-name");
    if (!name.value.trim()) return err("اكتب الاسم.", name);
    // تحقّق من الأسطر الجديدة قبل أي حفظ
    const fresh = [...app.querySelectorAll(".krow.new")].filter(r => r.querySelector(".kname").value.trim());
    for (const r of fresh) if (!r.querySelector("input[type=radio]:checked")) return err(`اختر «ابن» أو «بنت» لـ ${r.querySelector(".kname").value.trim()}.`, r.querySelector(".kname"));
    for (const r of app.querySelectorAll(".krow:not(.new)")) if (!r.querySelector(".kname").value.trim()) return err("لا تترك اسماً فارغاً. لحذف شخص اضغط «حذف» بجانبه.", r.querySelector(".kname"));
    setFields(id, {name: name.value.trim(), dead: document.getElementById("ef-dead").checked,
      spouse: document.getElementById("ef-spouse").value.trim(), alias: document.getElementById("ef-alias").value.trim(),
      notes: document.getElementById("ef-notes").value.trim(),
      gender: (app.querySelector("input[name=ef-g]:checked") || {}).value || p.gender});
    app.querySelectorAll(".krow:not(.new)").forEach(r => {
      const k = P[r.dataset.id]; if (!k) return;
      const nv = r.querySelector(".kname").value.trim(), dv = r.querySelector(".kdead input").checked, del = r.classList.contains("del");
      if (nv !== k.name || dv !== !!k.dead) setFields(k.id, {name: nv, dead: dv});
      if (del !== !!k.delReq) setDel(k.id, del);
    });
    fresh.forEach(r => {
      const gk = r.dataset.g, g = groups.find(x => x.key === gk);
      const o = {t: "add", id: newId(), parent: id, v: {name: r.querySelector(".kname").value.trim(),
        gender: r.querySelector("input[type=radio]:checked").value, dead: r.querySelector(".kdead input").checked}};
      if (g && g.other) { o.other = g.other; if (g.group) o.v.group = g.group; }
      else if (g && g.group) o.v.group = g.group;
      else if (gk.startsWith("new:")) { const w = r.closest(".egrp").querySelector(".wname").value.trim(); if (w) o.v.group = (isF(p) ? "الزوج: " : "الزوجة: ") + w; }
      EDIT.ops.push(o); applyOp(o);
    });
    const nt = document.getElementById("ef-note").value.trim();
    EDIT.ops = EDIT.ops.filter(o => !(o.t === "note" && o.id === id));
    if (nt) EDIT.ops.push({t: "note", id, text: nt});
    EDIT.save(); dirty = false;
    return true;
  }
  document.getElementById("ef-save").onclick = () => {
    if (!save()) return;
    EF_MSG = EDIT.ops.length ? "حُفظ. عندما تنتهي اضغط الزر الأخضر «مراجعة وإرسال»." : "حُفظ. لم تُغيّر شيئاً.";
    viewEditFamily(id); renderEditBar("editfam");
    window.scrollTo({top: document.body.scrollHeight});
  };
  const dl = document.getElementById("ef-del");
  if (dl) dl.onclick = () => { if (!save()) return; setDel(id, !p.delReq); EDIT.save(); EF_MSG = p.delReq ? "سُجّل طلب الحذف." : "أُلغي طلب الحذف."; viewEditFamily(id); renderEditBar("editfam"); };
  const rm = document.getElementById("ef-rm");
  if (rm) rm.onclick = () => { const par = upParent(p); removeAdded(id); EDIT.save(); location.hash = par ? eid(par.id) : "#edit"; };
  // الانتقال إلى أسرة أخرى أو إلى المراجعة يحفظ ما كُتب أولاً
  app.querySelectorAll('a[href^="#e-"]').forEach(a => a.addEventListener("click", e => { if (dirty && !save()) e.preventDefault(); }));
  const fab = document.getElementById("efab");
  fab.onclick = e => { if (location.hash === eid(id) && dirty && !save()) e.preventDefault(); };
}

// ---------- وصف التغييرات بالعربية (للمراجعة والبريد)
const FL = {name: "الاسم", alias: "اللقب", gender: "الجنس", spouse: "الزوج/الزوجة", dead: "الوفاة", notes: "الملاحظة"};
const who = id => P[id] ? shortName(P[id], 5) + (P[id].isNew ? " (جديد)" : "") : id;
function opText(o){
  if (o.t === "edit") {
    const a = ORIG[o.id], parts = EFIELDS.filter(k => (a[k] || "") !== (o.v[k] || "")).map(k =>
      k === "dead" ? (o.v.dead ? "صار متوفى" : "أُلغيت علامة الوفاة") : `${FL[k]}: «${a[k] || "—"}» ← «${o.v[k] || "—"}»`);
    return {k: "تعديل", c: "ed", t: `${shortName(a, 5)}: ${parts.join("، ")}`};
  }
  if (o.t === "add") {
    const v = o.v, par = P[o.parent];
    const bits = [v.gender === "أنثى" ? "بنت" : "ابن", v.group, o.other && P[o.other] && !v.group ? (isF(par) ? "أبوه: " : "أمه: ") + shortName(P[o.other], 3) : "",
      v.dead ? "متوفى" : "", v.alias ? "لقبه «" + v.alias + "»" : "", v.spouse ? "زوجه/زوجته: " + v.spouse : "", v.notes].filter(Boolean);
    return {k: "إضافة", c: "new", t: `في أبناء ${who(o.parent)}: ${v.name} (${bits.join("، ")})`};
  }
  if (o.t === "del") return {k: "حذف", c: "del", t: `طلب حذف ${who(o.id)}` + (o.why ? ` — السبب: ${o.why}` : "")};
  return {k: "ملاحظة", c: "ed", t: `عن ${who(o.id)}: ${o.text}`};
}

// ---------- المراجعة والإرسال: ‎#edits‎ (لا يُرسل إلا بعد كتابة الاسم)
function viewEdits(){
  const ops = EDIT.ops;
  app.innerHTML = `<h1>مراجعة التغييرات</h1>
    ${ops.length ? `<p class="lead">تأكد من التغييرات، ثم اكتب اسمك واضغط إرسال. ستصل إلينا لنراجعها ونضيفها إلى الموقع.</p>
    <ul class="oplist">${ops.map((o, i) => { const x = opText(o);
      return `<li><div class="ot"><span class="ok tag ${x.c}">${x.k}</span>${esc(x.t)}</div>
        <a class="btn ghost sm" href="${eid(o.t === "add" ? o.parent : o.id)}">تعديل</a>
        <button class="btn ghost sm" type="button" data-i="${i}">إلغاء</button></li>`; }).join("")}</ul>
    <form class="panel eform" id="sendf" style="margin-top:16px">
      <div class="fld"><label for="s-who">اسمك <span class="opt">(مطلوب للإرسال)</span></label><input id="s-who" value="${esc(EDIT.who)}" autocomplete="name"></div>
      <div class="fld"><label for="s-tel">رقم للتواصل <span class="opt">(اختياري)</span></label><input id="s-tel" type="tel" inputmode="tel" dir="ltr" value="${esc(EDIT.phone)}"></div>
      <div class="row3"><button class="btn" type="submit" id="s-go">إرسال التغييرات</button><a class="btn ghost" href="#tree">متابعة التعديل</a></div>
      <p class="emsg err" id="s-st" role="status"></p>
    </form>` : `<p class="lead">لا توجد تغييرات بعد. اضغط «صحّح أو أضف» عند أي شخص.</p>
    <a class="btn" href="#edit">صحّح أو أضف</a>`}`;
  app.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
    const o = EDIT.ops[+b.dataset.i];
    if (o.t === "add") removeAdded(o.id); else EDIT.ops = EDIT.ops.filter(x => x !== o);
    EDIT.save(); location.reload();
  });
  const f = document.getElementById("sendf"); if (!f) return;
  const w = document.getElementById("s-who"), go = document.getElementById("s-go");
  const upd = () => { go.disabled = !w.value.trim(); go.classList.toggle("off", go.disabled); };
  w.addEventListener("input", upd); upd();
  f.onsubmit = async e => {
    e.preventDefault();
    const st = document.getElementById("s-st");
    if (!w.value.trim()) { st.textContent = "اكتب اسمك أولاً، فلا تُرسل التغييرات بلا اسم."; w.focus(); return; }
    EDIT.who = w.value.trim(); EDIT.phone = document.getElementById("s-tel").value.trim(); EDIT.save();
    // نفس صيغة نموذج «اقتراح أو سؤال» المجرَّب: الاسم والرسالة ورقم التواصل
    // رقم الشخص في آخر كل سطر حتى يُعرف المقصود بدقة عند التطبيق (لا يظهر في صفحة المراجعة)
    const ref = o => o.t === "add" ? (P[o.parent] && P[o.parent].isNew ? "" : `  [في ${o.parent}]`) : `  [${o.id}]`;
    const lines = ops.map((o, i) => { const x = opText(o); return `${AR(i + 1)}- ${x.k}: ${x.t}${ref(o)}`; });
    const body = {"الاسم": EDIT.who, "الرسالة": lines.join("\n"),
      "رقم التواصل": EDIT.phone || "—", _subject: "شجرة البشيراب: تعديلات من " + EDIT.who, _template: "table"};
    go.disabled = true; st.className = "emsg"; st.textContent = "جارٍ الإرسال…";
    try {
      var ac = new AbortController(), tm = setTimeout(() => ac.abort(), 90000);
      var slow = setTimeout(() => { st.textContent = "الإرسال يستغرق أحياناً دقيقة، لا تغلق الصفحة…"; }, 6000);
      const r = await fetch("https://formsubmit.co/ajax/" + DATA.formTo, {method: "POST", signal: ac.signal,
        headers: {"Content-Type": "application/json", "Accept": "application/json"}, body: JSON.stringify(body)});
      const j = await r.json().catch(() => ({})); clearTimeout(tm); clearTimeout(slow);
      if (!r.ok || String(j.success) === "false") throw new Error(j.message || r.status);
      EDIT.ops = []; EDIT.save();
      app.innerHTML = `<h1>شكراً لك</h1><p class="fok" tabindex="-1" id="s-ok">وصلت تغييراتك إلينا، وسنراجعها ونضيفها إلى الموقع بإذن الله.</p>
        <div class="row3" style="margin-top:16px"><button class="btn" type="button" id="s-again">تعديلات أخرى</button>
        <button class="btn ghost" type="button" id="s-out">انتهيت</button></div>`;
      document.getElementById("s-ok").focus();
      document.getElementById("s-again").onclick = () => { location.hash = "#edit"; location.reload(); };
      document.getElementById("s-out").onclick = () => { EDIT.on = false; EDIT.save(); location.hash = ""; location.reload(); };
      renderEditBar("edits");
    } catch (err) {
      go.disabled = false; st.className = "emsg err";
      clearTimeout(slow); st.textContent = err.name === "AbortError" ? "لم يصلنا تأكيد الإرسال. قد تكون وصلت رغم ذلك؛ إن لم تصل، أرسلها عبر واتساب." : "لم تُرسل. تأكد من الاتصال بالإنترنت وحاول مرة أخرى، أو أرسلها عبر واتساب.";
      if (!document.getElementById("s-wa")) { const a = document.createElement("a"); a.id = "s-wa"; a.className = "btn ghost"; a.target = "_blank";
        a.textContent = "أرسلها عبر واتساب"; a.href = "https://wa.me/?text=" + encodeURIComponent("تعديلات شجرة البشيراب من " + EDIT.who + ":\n" + lines.join("\n"));
        st.after(a); }
    }
  };
}

// ---------- عدّاد الزوار (counterapi.dev، بلا حساب): جهاز جديد مرة واحدة، وزيارة مرة لكل جهاز في اليوم.
// لا يُحسب جهاز صاحب الموقع (من فتح صفحة الآدمن)، ولا النسخة المحلية من الموقع.
const CNT = "https://api.counterapi.dev/v1/bashirab-family-ab11/";
(function countVisit(){
  try {
    if (ADMIN_ONLY) { localStorage.setItem("bashirab_admin", "1"); return; }
    if (location.protocol !== "https:" || localStorage.getItem("bashirab_admin") === "1") return;
    const today = new Date().toISOString().slice(0, 10);
    if (!localStorage.getItem("bashirab_dev")) { localStorage.setItem("bashirab_dev", today); fetch(CNT + "devices/up").catch(() => {}); }
    if (localStorage.getItem("bashirab_day") !== today) { localStorage.setItem("bashirab_day", today); fetch(CNT + "visits/up").catch(() => {}); }
    // كل فتح للموقع (مرة لكل نافذة؛ التنقل داخل الموقع أو تحديث الصفحة لا يُعاد حسابه)
    if (!sessionStorage.getItem("bashirab_open")) { sessionStorage.setItem("bashirab_open", "1"); fetch(CNT + "opens/up").catch(() => {}); }
  } catch (e) {}
})();
async function cntGet(path){
  const r = await fetch(CNT + path); if (!r.ok) throw new Error(r.status);
  return r.json();
}
const numOf = j => { if (j == null) return null; if (typeof j === "number") return j;
  for (const k of ["count", "Count", "value", "Value"]) if (typeof j[k] === "number") return j[k];
  if (j.data != null) return numOf(j.data); return null; };
function listOf(j){
  const arr = Array.isArray(j) ? j : Array.isArray(j && j.data) ? j.data : Array.isArray(j && j.counts) ? j.counts : [];
  return arr.map(it => { let d = "", n = null;
    for (const [k, v] of Object.entries(it)) { if (typeof v === "number" && n === null) n = v; else if (typeof v === "string" && /\d{4}-\d{2}-\d{2}/.test(v) && !d) d = v; }
    return {d, n}; }).filter(x => x.d && x.n !== null);
}

// ---------- صفحة الآدمن: ‎#admin‎ (لا تظهر في أي قائمة)

  // الأجيال: البعد عن الجد الأكبر عبر الأب أو الأم
  const GEN = {}; const gen = id => { if (GEN[id]) return GEN[id]; const p = P[id]; GEN[id] = 1;
    const ps = [p.father, p.mother].filter(x => x && P[x]); GEN[id] = ps.length ? 1 + Math.max(...ps.map(gen)) : 1; return GEN[id]; };
  all.forEach(p => gen(p.id));
  const byGen = {}; all.forEach(p => byGen[GEN[p.id]] = (byGen[GEN[p.id]] || 0) + 1);
  const brs = [...kidsOf(P[MAIN]), ...kidsOf(P[ROOT]).filter(k => k.id !== MAIN)];
  const base = DATA.base || {b: {}};
  const brRows = brs.map(b => { const c = descendants(b.id).size + 1, was = base.b[b.id]; return {b, c, d: was == null ? null : c - was}; }).sort((a, z) => z.c - a.c);

  const SP = /^(احمد|اسماء|ابراهيم|اسامة|اسامه|امنة|امنه|امين|ايمن|اسيا|اخلاص|اقبال|اكرام|امير|انور|ايمان|الاء|امل|امال|انس|اسراء|اية|ابتسام|ادريس|اسماعيل|ادم)$|^(فاطمه|عائشه|عايشه|آمنه|خديجه|رقيه|سميره|منيره|حليمه|زكيه|سعيده|نفيسه)$/;
  const spell = all.filter(p => SP.test(p.name));
  const tmp = all.filter(p => (p.notes || "").includes("مؤقت"));
  const L = (p, t) => `<a href="${SH(hashOf(p.id))}"${TG}>${esc(t || shortName(p, 5))}</a> <a class="sm" href="${SH(eid(p.id))}"${TG} aria-label="تعديل ${esc(p.name)}">✎ تعديل</a>`;
  const T = (cap, head, rows) => `<div class="tblw"><table class="atbl"><caption>${cap}</caption><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  document.title = "لوحة التحكم · عائلة البشيراب";
  app.innerHTML = `<h1>لوحة التحكم</h1>
    <p class="lead">لعائلة البشيراب. هذه الصفحة لا تظهر في الموقع، فاحفظ رابطها عندك. زياراتك من هذا الجهاز لا تُحسب في عدّاد الزوار.${ADMIN_ONLY ? ` روابط الأسماء تفتح الموقع في نافذة جديدة. <a href="index.html" target="_blank">فتح الموقع</a>` : ""}</p>
    <nav class="panel" aria-label="أقسام اللوحة"><ul class="alinks">
      <li><a href="#a-vis">الزوار</a></li><li><a href="#a-num">الأرقام</a></li><li><a href="#a-miss">ما ينقص الشجرة</a></li>
      <li><a href="#a-find">البحث بالرقم والاسم</a></li><li><a href="#a-log">سجل الإضافات</a></li><li><a href="#a-files">الملفات</a></li></ul></nav>

    <section class="panel" id="a-vis" tabindex="-1"><h2>الزوار</h2>
      <ul class="anums" id="v-sum" role="status"><li>جارٍ جلب الأرقام…</li></ul>
      <div id="v-days"></div>
      <p class="muted">العدّ بدأ في ١٨ نوفمبر ٢٠٢٦، والأيام بتوقيت غرينتش. «الأشخاص» عدد الجوالات والأجهزة المختلفة التي فتحت الموقع، فكل جهاز يُحسب مرة واحدة مهما تكرر دخوله. «مرات الفتح» كل مرة يُفتح فيها الموقع (التنقل بين صفحاته لا يُحسب فتحاً جديداً).</p></section>

    <section class="panel" id="a-num" tabindex="-1"><h2>الأرقام</h2>
      <ul class="anums">
        <li>عدد أفراد الشجرة: <b>${AR(n)}</b>${base.total != null && n !== base.total ? ` (${n > base.total ? "+" : ""}${AR(n - base.total)} منذ ${esc(base.date)})` : ""}</li>
        <li>الأحياء: <b>${AR(n - dead)}</b>، والمتوفون رحمهم الله: <b>${AR(dead)}</b></li>
        <li>الذكور: <b>${AR(m)}</b>، والإناث: <b>${AR(f)}</b></li>
        <li>عدد الأجيال من الجد الأكبر بشير: <b>${AR(Math.max(...Object.values(GEN)))}</b></li>
      </ul>
      ${T("عدد الأفراد في كل جيل", ["الجيل", "العدد"], Object.keys(byGen).sort((a, b) => a - b).map(g => `<tr><th scope="row">${AR(+g)}</th><td>${AR(byGen[g])}</td></tr>`))}
      ${T(`الفروع، من الأكبر إلى الأصغر${base.date ? ` · الزيادة منذ ${esc(base.date)}` : ""}`, ["الفرع", "العدد مع رأس الفرع", "الزيادة"],
        brRows.map(r => `<tr><th scope="row"><a href="${SH(tid(r.b.id))}"${TG}>${esc(nm(r.b))}</a></th><td>${AR(r.c)}</td><td>${r.d ? (r.d > 0 ? "+" : "") + AR(r.d) : "—"}</td></tr>`))}
      <p class="muted">من كان أبوه من فرع وأمه من فرع آخر يُحسب في الفرعين.</p></section>

    <section class="panel" id="a-miss" tabindex="-1"><h2>ما ينقص الشجرة</h2>

      <ul class="alist">${(DATA.pending || []).map(([id, t]) => `<li>${esc(t)} ${P[id] ? L(P[id], isF(P[id]) ? "صفحتها" : "صفحته") : ""}</li>`).join("") || "<li>لا شيء.</li>"}</ul>
      <h3>أبناء لم تُسجَّل أسماؤهم (${AR(unk.length)})</h3>
      <ul class="alist">${unk.map(p => `<li>${L(p)}: ${esc(p.unknown)}</li>`).join("")}</ul>

      <ul class="alist">${noWife.map(p => `<li>${L(p)} (${AR(p.kids.length)} ${p.kids.length > 2 && p.kids.length < 11 ? "أبناء" : "من الأبناء"})</li>`).join("")}</ul>
      <h3>ترتيب الأبناء مؤقت (${AR(tmp.length)})</h3>
      <ul class="alist">${tmp.map(p => `<li>${L(p)}</li>`).join("") || "<li>لا شيء.</li>"}</ul>
      <h3>أسماء تحتاج مراجعة إملائية (${AR(spell.length)})</h3>
      <ul class="alist">${spell.map(p => `<li>${L(p)}</li>`).join("") || "<li>لا شيء. (تُفحص الهمزات مثل احمد واسماء، والتاء المربوطة مثل فاطمه)</li>"}</ul></section>

    <section class="panel" id="a-find" tabindex="-1"><h2>البحث بالرقم والاسم</h2>
      <div class="fld"><label for="a-id">رقم الشخص، مثل 1.12.1</label>
        <div class="row3"><input id="a-id" dir="ltr" inputmode="decimal" style="flex:1;min-width:0"><button class="btn" type="button" id="a-idgo">اعرض</button></div></div>
      <div class="fld" style="margin-top:12px"><label for="a-q">أو اكتب الاسم</label>
        <div class="searchbox" id="a-search" style="max-width:none"><input id="a-q" type="search" autocomplete="off"><div class="results"></div></div></div>
      <div id="a-res" role="status" aria-live="polite"></div></section>

    <section class="panel" id="a-log" tabindex="-1"><h2>سجل الإضافات</h2>
      ${(DATA.changes || []).map(([d, items]) => `<h3>${esc(d)}</h3><ul class="alist">${items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`).join("")}</section>

        <li><a href="bashirab-family-data.xlsx" download>ملف Excel بالبيانات</a></li>
        <li><a href="bashirab-family-edit.docx" download>نسخة Word للتعديل</a></li></ul></section>`;
  app.querySelectorAll(".alinks a").forEach(a => a.onclick = e => { e.preventDefault(); const s = document.querySelector(a.getAttribute("href")); s.scrollIntoView({behavior: "smooth"}); s.focus({preventScroll: true}); });
  // البحث
  const res = document.getElementById("a-res");
  const show = p => {
    if (!p) { res.innerHTML = `<p class="emsg err">لا يوجد شخص بهذا الرقم.</p>`; return; }
    const mo = p.mother && P[p.mother], fa = p.father && P[p.father];
    res.innerHTML = `<div class="ares"><h3>${esc(p.name)}${p.alias ? ` «${esc(p.alias)}»` : ""}${p.dead ? " (ر)" : ""}</h3><ul class="alist">

      <li>النسب الكامل: ${esc(shortName(p, 20))}</li>
      <li>${isF(p) ? "أنثى" : "ذكر"}${p.spouse ? ` · ${isF(p) ? "زوجها" : "زوجته"}: ${esc(p.spouse)}` : ""}</li>
      ${mo ? `<li>${isF(p) ? "أمها" : "أمه"}: ${esc(shortName(mo, 4))} <span dir="ltr">(${esc(mo.id)})</span></li>` : p.group ? `<li>${p.group.startsWith("الأم:") ? (isF(p) ? "أمها: " : "أمه: ") + esc(p.group.replace(/^الأم:\s*/, "")) : "من: " + esc(p.group)}</li>` : ""}

  };

  document.getElementById("a-idgo").onclick = go;

  (async () => {

    const [dv, op, dvL, vsL, opL, opH] = await Promise.all([get("devices/"), get("opens/"),

  })();
}
