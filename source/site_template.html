<style>
:root{
  --ink:#1f2d33; --muted:#66757b; --line:#dde4e6; --bg:#f6f4ee; --card:#fff;
  --teal:#1f4e5f; --teal2:#2c6a7d; --gold:#b8901c; --gold-bg:#fbf4dc;
  --m:#2f6d93; --m-bg:#e9f2f8; --f:#a4466f; --f-bg:#fbedf3; --u-bg:#f1f1ef;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}
header{background:var(--teal);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.hwrap{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:Amiri,serif;font-size:26px;text-decoration:none;color:#f5e6b0;white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:#dbe8ec;text-decoration:none;padding:5px 11px;border-radius:999px;font-size:14px}
nav a.on,nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.searchbox{position:relative;flex:1;min-width:200px}
@media(max-width:700px){
  header{position:static}
  .hwrap{gap:8px;padding:8px 12px}
  .brand{font-size:22px}
  nav{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap;font-size:13.5px;padding:5px 10px}
  .searchbox input{padding:8px 12px}
}
.searchbox input{width:100%;padding:9px 14px;border-radius:10px;border:0;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.results{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none;color:var(--ink)}
.results.show{display:block}
.results button{display:block;width:100%;text-align:right;border:0;background:none;padding:9px 14px;font:inherit;cursor:pointer;border-bottom:1px solid #f0f2f3}
.results button:hover,.results button.act{background:#f2f7f8}
.rnote{padding:8px 14px;font-size:13px;color:var(--muted);background:#fafbfb}
.results small{color:var(--muted);display:block;font-size:12px}
main{max-width:1000px;margin:auto;padding:22px 16px 60px}
h1{font-family:Amiri,serif;font-size:34px;margin:0 0 4px;color:var(--teal)}
h2{font-size:19px;margin:28px 0 10px;color:var(--teal)}
.lead{color:var(--muted);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;color:var(--teal)}
.stat span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.4px solid;border-radius:9px;padding:4px 11px;font-size:14.5px;text-decoration:none;cursor:pointer;background:#fff;line-height:1.5}
.chip.m{border-color:var(--m);background:var(--m-bg)}
.chip.f{border-color:var(--f);background:var(--f-bg)}
.chip.u{border-color:#aaa;background:var(--u-bg)}
.chip.dash{border-style:dashed;color:var(--muted);cursor:default;background:#fff}
.chip.hl{box-shadow:0 0 0 2.5px var(--gold)}
.chip:hover:not(.dash){filter:brightness(.96)}
.sym{color:#6a7a80;font-size:.9em}
.dead{color:#5f6a6e;font-weight:500;font-size:.85em}
.deadfull{font-size:.45em;color:#6b777b;font-weight:500;vertical-align:middle}
.chip.m.dd,.chip.f.dd,.chip.u.dd{border-color:#97a2a6;background:#eceeee}
.grouplbl{font-size:13px;color:var(--muted);margin:10px 0 6px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{text-decoration:none;color:var(--teal2)}
.crumbs a:hover{text-decoration:underline}
.pcard{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;flex:none;border:2px solid}

.avatar.f{background:var(--f-bg);border-color:var(--f);color:var(--f)}

.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;border-radius:10px;padding:8px 16px;font-size:14.5px;border:0;cursor:pointer;font:inherit}

.empty{color:var(--muted);font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:box-shadow .15s,transform .15s}
.bcard:hover{box-shadow:0 6px 18px rgba(31,78,95,.12);transform:translateY(-1px)}
.bcard:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--gold)}
.bcard .bn{font-size:19px;font-weight:700;color:var(--teal)}
.bcard .bs{font-size:13px;color:var(--muted);margin-top:2px}
.bcard .bnum{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}

.bcard .bkids{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6}
.news{border-right:4px solid var(--gold)}
.news ul{margin:4px 0 0;padding-right:18px}
.news li{margin:3px 0}
.news .nd{font-size:12.5px;color:var(--muted);margin-top:8px}
.bpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bpick a{text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--teal)}
.bpick a.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.bpick a small{color:inherit;opacity:.7;margin-right:4px}
.askbox{margin-top:10px;background:#fff8e6;border:1px dashed #d8b85a;border-radius:10px;padding:8px 12px;font-size:14px}
.askbox a{color:var(--teal);font-weight:700}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:8px;font-size:14px}
.bar a{color:var(--teal);text-decoration:none}
.bar .tr{background:#eef2f3;border-radius:6px;height:14px;overflow:hidden}
.bar .fl{background:var(--teal2);height:100%;border-radius:6px}
.bar .v{text-align:left;color:var(--muted);font-size:13px}
.rank{counter-reset:r;list-style:none;padding:0;margin:0}
.rank li{counter-increment:r;display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rank li:last-child{border:0}
.rank li:before{content:counter(r, arabic-indic);color:var(--gold);font-weight:700;width:22px}
.rank li span:first-of-type{flex:1}
.rank .v{color:var(--muted);font-size:13px}
h1.pname{font-family:inherit;color:var(--ink)}
#mebar .mewrap{max-width:1000px;margin:auto;padding:8px 16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#mebar .meline{background:var(--gold-bg);border-bottom:1px solid #ecdca6;color:var(--ink)}
#mebar .meline a{color:var(--teal);font-weight:700;text-decoration:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--teal2);text-decoration:underline;cursor:pointer}
.mechoose{max-width:1000px;margin:16px auto 0;padding:0 16px}
.mechoose .panel{border:1.5px solid var(--gold);background:var(--gold-bg);margin:0}
.mechoose h2{margin:0 0 4px;font-size:19px;color:var(--teal)}
.mechoose p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.mechoose .row2{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mechoose .searchbox{max-width:420px}
.mechoose .searchbox input{width:100%;padding:9px 12px;border:1px solid #c9b77c;border-radius:10px;font:inherit;font-size:15px;background:#fff}
.mebox{margin-top:12px;border:1.5px solid var(--gold);background:var(--gold-bg);border-radius:12px;padding:10px 14px}
.mebox .melbl{font-size:13px;color:#8a6d12;font-weight:700;margin-bottom:2px}
.mebox .mel{font-size:16.5px;font-weight:700;color:var(--teal)}
.mebox .mside{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin:-2px 0 4px}
.mebox a{font-size:13.5px;color:var(--teal2)}
.fixform{display:flex;flex-direction:column;gap:14px;max-width:620px}
.fld label{display:block;font-size:14.5px;margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid #b9c6ca;border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.fld textarea{resize:vertical}
.fld .opt{color:var(--muted);font-weight:400;font-size:13px}
#f-contact{text-align:right}
@media(max-width:700px){.fixform .btn{align-self:stretch}}
.fixform .btn{align-self:flex-start;padding:10px 26px}
.fstatus{margin:0;color:#8a2f2f;min-height:1em}
.fok{font-size:17px;color:var(--teal);font-weight:700;margin:0}
footer a{color:var(--teal2)}
</style>

<body>
<header><div class="hwrap">
  <a class="brand" href="#">البشيراب</a>
  <nav id="nav" aria-label="القائمة الرئيسية">
    <a href="#" data-v="home">الرئيسية</a>
    <a href="#tree" data-v="tree">الشجرة</a>
    <a href="#relation" data-v="relation">صلة القرابة</a>
    <a href="#stats" data-v="stats">أرقام العائلة</a>
    <a href="#fix" data-v="fix">أرسل تصحيحاً</a>
    <a href="__PDF__" download="__PDFNAME__">تحميل الكتاب PDF</a>
  </nav>
  <div class="searchbox" id="topsearch"><input type="search" placeholder="ابحث عن اسم…" aria-label="ابحث عن اسم في العائلة" autocomplete="off"><div class="results"></div></div>
</div></header>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="mebar"></div>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>

<script>
const DATA = __DATA__;
const P = {}; DATA.people.forEach(p => P[p.id] = p);
const ROOT = "1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const G = {"ذكر":"m","أنثى":"f","غير معروف":"u"};
const SYM = {"ذكر":"♂","أنثى":"♀","غير معروف":""};
const isM = p => p.gender === "ذكر", isF = p => p.gender === "أنثى";
const hashOf = id => "#p-" + id.replace(/\./g, "-");

function lineage(p){ // الاسم مع النسب
  const parts = [p.name]; let q = p;
  while (q.father && P[q.father]) { q = P[q.father]; parts.push(q.name); }
  if (!p.father && p.father_txt) parts.push(p.father_txt);
  return parts.join(" ");
}
function shortName(p, n=4){
  if (!p.father && !p.father_txt && p.mother) return p.name + (isF(p)?" بنت ":" ابن ") + P[p.mother].name;
  return lineage(p).split(" ").slice(0, n).join(" ");
}
function ancestorsLine(p){ const out=[]; let q=p; while(q.father && P[q.father]){q=P[q.father]; out.unshift(q);} return out; }
function kidsOf(p){ return p.kids.map(id => P[id]); }
function spouseOf(p){ // زوج من داخل الشجرة (عبر الأبناء المشتركين)
  const s = new Set();
  kidsOf(p).forEach(k => { [k.father,k.mother].forEach(x => { if (x && x !== p.id && P[x]) s.add(x); }); });
  return [...s].map(id => P[id]);
}
function deadMark(p, full){ return p.dead ? (full ? ` <span class="deadfull">${isF(p) ? "رحمها" : "رحمه"} الله</span>` : ` <span class="dead" aria-hidden="true">(ر)</span><span class="sr-only">، ${isF(p) ? "رحمها" : "رحمه"} الله</span>`) : ""; }
const symH = p => `<span class="sym" aria-hidden="true">${SYM[p.gender]}</span>`;
function chip(p, extra="", label){
  return `<a class="chip ${G[p.gender]} ${p.dead ? "dd" : ""} ${extra}" href="${hashOf(p.id)}">${esc(label || p.name)} ${symH(p)}${deadMark(p)}</a>`;
}
const unk = t => `<span class="chip dash">؟ ${esc(t)}</span>`;

// ---------- بحث
// تطبيع الكتابة: الهمزات، الياء والألف المقصورة، التاء المربوطة، التشكيل، المسافات، و"بن/بنت"
function norm(s){
  return String(s || "").replace(/[ً-ْٰـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ء/g, "")
    .replace(/ى/g, "ي").replace(/ة/g, "ه")
    .split(/\s+/).filter(w => w && !["بن","ابن","بنت","ابنه","بنه","ولد"].includes(w)).join("");
}
function editDist(a, b){ // مسافة التحرير (لأخطاء الكتابة البسيطة)
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const SKEY = {};
function skeys(p){ // الاسم مع نسبه من جهة الأب، ومن جهة الأم
  if (SKEY[p.id]) return SKEY[p.id];
  const viaMother = p.mother && P[p.mother] ? norm(p.name) + norm(lineage(P[p.mother])) : "";
  return SKEY[p.id] = {name: norm(p.name), line: norm(lineage(p)), mline: viaMother};
}
const MAXR = 8;
const nRes = n => n === 2 ? "نتيجتان" : `${AR(n)} ${n >= 3 && n <= 10 ? "نتائج" : "نتيجة"}`;
function searchList(q){
  q = norm(q);
  if (!q) return {items: [], more: 0};
  const scored = [];
  DATA.people.forEach(p => {
    const k = skeys(p); let s = -1;
    if (k.name === q) s = 0;                                         // الاسم نفسه
    else if (k.line.startsWith(q) || k.mline.startsWith(q)) s = 1;   // الاسم ثم الأب ثم الجد…
    else if (k.name.startsWith(q)) s = 2;                            // بداية الاسم
    else if (q.length >= 3 && (k.line.includes(q) || k.mline.includes(q))) s = 3;
    if (s >= 0) scored.push({p, s, len: k.line.length});
  });
  if (!scored.length && q.length >= 3) { // لا نتائج: نجرب التسامح مع خطأ كتابة بسيط
    const tol = q.length >= 8 ? 2 : 1;
    DATA.people.forEach(p => { const k = skeys(p);
      const dd = Math.min(...[k.line, k.mline].filter(Boolean).map(l => editDist(q, l.slice(0, q.length))),
                          ...[k.line, k.mline].filter(Boolean).map(l => editDist(q, l.slice(0, q.length + 1))),
                          ...[k.line, k.mline].filter(Boolean).map(l => editDist(q, l.slice(0, Math.max(q.length - 1, 1)))));
      if (dd <= tol) scored.push({p, s: 4 + dd, len: k.line.length}); });
  }
  scored.sort((x, y) => x.s - y.s || x.len - y.len);
  // إن وُجد من يبدأ اسمه بما كُتب، لا نعرض من يرد الاسم في نسبه فقط
  if (scored.length && scored[0].s <= 2) scored.splice(0, scored.length, ...scored.filter(x => x.s <= 2));
  return {items: scored.slice(0, MAXR).map(x => x.p), more: Math.max(0, scored.length - MAXR), fuzzy: scored.length && scored[0].s >= 4};
}
function wireSearch(box, onPick){
  const inp = box.querySelector("input"), res = box.querySelector(".results");
  let items = [], more = 0, fuzzy = false;
  const live = document.getElementById("live");
  const draw = () => {
    res.innerHTML = (fuzzy ? `<div class="rnote">لم نجد الاسم كما كُتب، هل تقصد:</div>` : "") +
      items.map((p,i) => `<button data-i="${i}">${esc(p.name)} <span aria-hidden="true">${SYM[p.gender]}${p.dead?' (ر)':''}</span><small>${esc(shortName(p,6))}${p.dead ? (isF(p)?"، رحمها الله":"، رحمه الله") : ""}</small></button>`).join("")
      + (more ? `<div class="rnote">وهناك ${AR(more)} غيرهم. اكتب اسم الأب بعد الاسم لتضييق البحث.</div>` : "")
      || (inp.value.trim() ? `<div class="rnote">لا توجد نتائج. اكتب الاسم الأول فقط.</div>` : "");
    res.classList.toggle("show", !!inp.value.trim());
  };
  const say = () => {
    if (!inp.value.trim()) { live.textContent = ""; return; }
    if (!items.length) { live.textContent = "لا توجد نتائج"; return; }
    const n = items.length + more;
    live.textContent = (fuzzy ? "لم نجد الاسم كما كُتب، وهناك أسماء قريبة. " : "") +
      (n === 1 ? `نتيجة واحدة: ${shortName(items[0], 5)}.` : `${nRes(n)}` + (more ? "، اكتب اسم الأب لتضييق البحث." : "."));
  };
  let t;
  inp.addEventListener("input", () => { ({items, more, fuzzy} = searchList(inp.value)); draw(); clearTimeout(t); t = setTimeout(say, 350); });
  res.addEventListener("keydown", e => {
    const bs = [...res.querySelectorAll("button[data-i]")], i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { (bs[i+1] || bs[i]).focus(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { i > 0 ? bs[i-1].focus() : inp.focus(); e.preventDefault(); }
    else if (e.key === "Escape") { inp.focus(); res.classList.remove("show"); }
    else if (e.key === "Enter" && i >= 0) { e.preventDefault(); pick(items[i]); }
  });
  res.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) pick(items[+b.dataset.i]); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { const b = res.querySelector("button[data-i]"); if (b) { b.focus(); e.preventDefault(); } }
    else if (e.key === "Enter") {
      e.preventDefault();
      ({items, more, fuzzy} = searchList(inp.value)); draw();
      if (items.length === 1 && !fuzzy) pick(items[0]);          // نتيجة واحدة مؤكدة: تُختار مباشرة
      else if (items.length) { res.querySelector("button[data-i]").focus();   // أكثر من نتيجة: ننقل إلى القائمة ليختار
        live.textContent = `${nRes(items.length + more)}، اختر منها.`; }
      else say();
    }
    else if (e.key === "Escape") { res.classList.remove("show"); }
  });
  box.addEventListener("focusout", () => setTimeout(() => { if (!box.contains(document.activeElement)) res.classList.remove("show"); }, 150));
  function pick(p){ res.classList.remove("show"); onPick(p, inp); }
}

const DESC = {};
function descendants(id){ // كل الذرية المسجلة (بلا تكرار)
  if (DESC[id]) return DESC[id];
  const out = new Set(), st = [...P[id].kids];
  while (st.length) { const k = st.pop(); if (out.has(k)) continue; out.add(k); st.push(...P[k].kids); }
  return DESC[id] = out;
}
function depthOf(p){ let d = 1, q = p; while ((q.father && P[q.father]) || (q.mother && P[q.mother])) { q = P[q.father] || P[q.mother]; d++; } return d; }
function branchGens(id){ const base = depthOf(P[id]); let m = base; descendants(id).forEach(k => m = Math.max(m, depthOf(P[k]))); return m - base + 1; }

// ---------- صلة القرابة
const REL = {a: null, b: null};
function ancestors(id){ // BFS: ancestor -> {d, next}
  const m = new Map([[id, {d:0, next:null}]]); const q = [id];
  while (q.length) { const x = q.shift(); const p = P[x];
    [p.father, p.mother].forEach(par => { if (par && P[par] && !m.has(par)) { m.set(par, {d: m.get(x).d + 1, next: x}); q.push(par); } }); }
  return m;
}
function chain(m, top){ const out = [top]; let x = top; while (m.get(x).next) { x = m.get(x).next; out.push(x); } return out; } // من الجد نزولاً
// كل طرق الصعود من id إلى أجداده: [id, والد, ..., الجد]
function upPaths(id, depth = 0){
  const p = P[id], out = [[id]];
  if (depth > 12) return out;
  for (const par of [p.father, p.mother]) if (par && P[par])
    for (const path of upPaths(par, depth + 1)) out.push([id, ...path]);
  return out;
}
// الصلات بين a وb: لكل جهة (والد a أو والدته × والد b أو والدته) أقرب جد مشترك تلتقي عنده طريقان لا يشتركان في غيره
function relConnections(a, b){
  const PA = upPaths(a), PB = upPaths(b), byTop = {};
  PB.forEach(q => (byTop[q[q.length - 1]] ||= []).push(q));
  const best = {};
  for (const x of PA) {
    const top = x[x.length - 1];
    for (const y of byTop[top] || []) {
      const sx = new Set(x.slice(0, -1));
      if (y.slice(0, -1).some(n => sx.has(n))) continue;   // يلتقيان قبل هذا الجد
      const key = (x[1] || "") + "|" + (y[1] || "");
      const len = x.length + y.length;
      if (!best[key] || len < best[key].len) best[key] = {len, ca: x.slice().reverse(), cb: y.slice().reverse()};
    }
  }
  const all = Object.values(best).sort((u, v) => u.len - v.len);
  if (!all.length) return all;
  if (all[0].ca.length === 2 && all[0].cb.length === 2) return [all[0]];   // إخوة: لا حاجة لغيرها
  return all.filter(c => c.len <= all[0].len + 1).slice(0, 4);           // الصلات القريبة فقط
}
function relationLabel(a, b, ca, cb){ // ca وcb: من الجد المشترك نزولاً إلى a وb
  const top = ca[0], da = ca.length - 1, db = cb.length - 1;
  const pa = P[a], pb = P[b];
  const ab = (p, mWord, fWord) => isF(p) ? fWord : mWord;
  if (da === 0) { // a جد b
    if (db === 1) return `${pa.name} ${ab(pa,"والد","والدة")} ${pb.name}`;
    return `${pa.name} ${ab(pa,"جد","جدة")} ${pb.name}` + (db > 2 ? ` (من الدرجة ${AR(db-1)})` : "");
  }
  if (db === 0) {
    if (da === 1) return `${pa.name} ${ab(pa,"ابن","بنت")} ${pb.name}`;
    return `${pa.name} ${ab(pa,"حفيد","حفيدة")} ${pb.name}` + (da > 2 ? ` (من الدرجة ${AR(da-1)})` : "");
  }
  if (da === 1 && db === 1) {
        const sf = pa.father && pa.father === pb.father, sm = pa.mother && pa.mother === pb.mother;
    const g1 = pa.group && pb.group && pa.group !== pb.group;
    return `${pa.name} و${pb.name} إخوة` + (sf && sm ? " أشقاء" : sf && !g1 ? "" : sf ? " من الأب" : " من الأم");
  }
  if (da === 1 && db === 2) { // a عم/خال b
    const par = P[cb[1]];
    return `${pa.name} ${isM(par) ? ab(pa,"عم","عمة") : ab(pa,"خال","خالة")} ${pb.name}`;
  }
  if (da === 2 && db === 1) {
    const par = P[ca[1]];
    return `${pb.name} ${isM(par) ? ab(pb,"عم","عمة") : ab(pb,"خال","خالة")} ${pa.name}`;
  }
  // y ابن/بنت (عم/عمة/خال/خالة) x — حيث px والد x وpy والد y وهما إخوة
  const kinW = (px, y, py) => `${ab(y,"ابن","بنت")} ${isM(px) ? (isM(py) ? "عم" : "عمة") : (isM(py) ? "خال" : "خالة")}`;
  const kinOf = (x, px, y, py) => `${kinW(px, y, py)} ${x.name}`;
  if (da === 2 && db === 2) return `${pb.name} ${kinOf(pa, P[ca[1]], pb, P[cb[1]])}`;
  const up = (p, n) => n === 1 ? ab(p,"والد","والدة") : n === 2 ? ab(p,"جد","جدة") : ab(p,"جد","جدة") + ` من الدرجة ${AR(n-1)}`;
  if (da === 1 || db === 1) { // أحدهما أخو جدّ الآخر
    const [x, cy, dy] = da === 1 ? [pa, cb, db] : [pb, ca, da];
    const y = da === 1 ? pb : pa, sib = P[cy[1]];
    return `${x.name} ${ab(x,"أخو","أخت")} ${sib.name}، ${up(sib, dy-1)} ${y.name}`;
  }
  const n = Math.min(da, db) - 1, ord = ["","الأولى","الثانية","الثالثة","الرابعة","الخامسة"][n] || AR(n);
  const meet = `يلتقيان في ${P[top].name}`;
  if (da === db && n === 2) { // والداهما أبناء عم/خال
    const xa = P[ca[da-1]], xb = P[cb[db-1]];
    return `${xb.name} (${ab(xb,"والد","والدة")} ${pb.name}) ${kinW(P[ca[1]], xb, P[cb[1]])} ${xa.name} (${ab(xa,"والد","والدة")} ${pa.name})`;
  }
  if (da === db) return `${pa.name} و${pb.name} أقارب من الدرجة ${ord}: ${meet}`;
  const [old, yng, cold, cyng, dold, dyng] = da < db ? [pa, pb, ca, cb, da, db] : [pb, pa, cb, ca, db, da];
  const anc = P[cyng[dold]];
  if (n === 1) // old وanc أبناء عم/خال مباشرون
    return `${anc.name} (${up(anc, dyng-dold)} ${yng.name}) ${kinOf(old, P[cold[1]], anc, P[cyng[1]])}`;
  return `${old.name} و${anc.name} (${up(anc, dyng-dold)} ${yng.name}) أقارب من الدرجة ${ord}: ${meet}`;
}

  app.innerHTML = `<h1>صلة القرابة</h1>

function drawRel(){
  const sa = document.getElementById("sa"), sb = document.getElementById("sb"), out = document.getElementById("relout");
  sa.innerHTML = REL.a ? chip(P[REL.a], "", shortName(P[REL.a], 5)) : `<span class="empty">لم يُختر بعد</span>`;
  if (REL.a) sa.insertAdjacentHTML("afterbegin", '<span class="sr-only">الشخص الأول المختار: </span>');
  sb.innerHTML = REL.b ? chip(P[REL.b], "", shortName(P[REL.b], 5)) : `<span class="empty">لم يُختر بعد</span>`;
  if (!REL.a || !REL.b) { out.innerHTML = ""; return; }
  const live = document.getElementById("live");
  if (REL.a === REL.b) { out.innerHTML = `<div class="panel">اخترت الشخص نفسه مرتين.</div>`; live.textContent = "اخترت الشخص نفسه مرتين."; return; }
  const conns = relConnections(REL.a, REL.b);
  if (!conns.length) { out.innerHTML = `<div class="panel">لا يوجد جد مشترك مسجل بينهما بعد.</div>`; live.textContent = "لا يوجد جد مشترك مسجل بينهما بعد."; return; }
  const pa = P[REL.a], pb = P[REL.b];
  const married = spouseOf(pa).some(x => x.id === REL.b);
  const seen = new Set();
  const shown = conns.map(c => ({...c, label: relationLabel(REL.a, REL.b, c.ca, c.cb)})).filter(c => !seen.has(c.label) && seen.add(c.label));
  const side = (x, c) => c.length < 2 ? "" : (isM(P[c[c.length - 2]]) ? "أب" : "أم") + " " + x.name;
  out.innerHTML = (married ? `<div class="panel"><h2 class="verdict" tabindex="-1">${esc(pa.name)} و${esc(pb.name)} زوجان</h2>
      <div class="grouplbl" style="margin:6px 0 0">وصلة القرابة بينهما:</div></div>` : "") + shown.map(({ca, cb, label}, i) => {
    const top = ca[0];
    const sides = [side(pa, ca), side(pb, cb)].filter(Boolean);
    const col = arr => `<div class="col" aria-hidden="true">${arr.slice(1).reverse().map((id, j) => (j ? `<div class="arrow">▲</div>` : "") + chip(P[id])).join("")}</div>`;
    const say = arr => arr.slice().reverse().map((id, j, a) => j < a.length - 1 ? `${P[id].name} ${isF(P[id]) ? "بنت" : "ابن"}` : P[id].name).join(" ");
    const srPath = `<p class="sr-only">الطريق من الطرف الأول: ${esc(say(ca))}. والطريق من الطرف الثاني: ${esc(say(cb))}.</p>`;
    return `<div class="panel">
      ${shown.length > 1 && sides.length ? `<div class="grouplbl">${i ? "وصلة أخرى " : ""}من جهة ${esc(sides.join(" و"))}:</div>` : ""}
      <h2 class="verdict" tabindex="-1">${esc(label)}</h2>
      <div class="apex"><span class="sr-only">الجد المشترك: </span>${chip(P[top], "hl")}<div class="cnt" aria-hidden="true">الجد المشترك</div></div>
      ${srPath}<div class="path">${ca.length > 1 ? col(ca) : ""}${cb.length > 1 ? col(cb) : ""}</div>
    </div>`;
  }).join("") + `<button class="btn ghost" type="button" id="relreset">ابحث عن شخصين آخرين</button>`;
  out.querySelector(".verdict").focus();
  document.getElementById("relreset").onclick = () => { REL.a = REL.b = null; drawRel(); document.getElementById("ina").focus(); };
}

// ---------- أرسل تصحيحاً (يصل إلى الإيميل عبر FormSubmit)
const FIX = {about: null};
function viewFix(){
  const about = FIX.about && P[FIX.about];
  app.innerHTML = `<h1>أرسل تصحيحاً أو إضافة</h1>
    <p class="lead">اكتب ما تريد تصحيحه أو إضافته، وستصل رسالتك إلينا لنضيفها في التحديث القادم بإذن الله.</p>
    <form class="panel fixform" id="fixform" novalidate>
      <div class="fld"><label for="f-name">اسمك</label>
        <input id="f-name" name="الاسم" required autocomplete="name"></div>
      <div class="fld"><label for="f-msg">رسالتك</label>
        <textarea id="f-msg" name="الرسالة" rows="8" required placeholder="مثلاً: اسم ابن فلان الصحيح كذا، أو: فلانة تزوجت وأبناؤها …">${about ? "بخصوص " + esc(shortName(about, 5)) + ": " : ""}</textarea></div>
      <div class="fld"><label for="f-contact">رقم للتواصل <span class="opt">(اختياري)</span></label>

      <button class="btn" type="submit" id="f-send">إرسال</button>
      <p id="f-status" role="status" class="fstatus"></p>
    </form>`;
  FIX.about = null;
  const form = document.getElementById("fixform"), st = document.getElementById("f-status"), send = document.getElementById("f-send");
  form.onsubmit = async e => {
    e.preventDefault();
    const name = form.querySelector("#f-name"), msg = form.querySelector("#f-msg");
    if (!name.value.trim()) { st.textContent = "اكتب اسمك من فضلك."; name.focus(); return; }
    if (!msg.value.replace(/^بخصوص [^:]*:/, "").trim()) { st.textContent = "اكتب رسالتك من فضلك."; msg.focus(); return; }
    const body = Object.fromEntries(new FormData(form));
    if (body._honey) return;
    body._subject = "شجرة البشيراب: رسالة من " + body["الاسم"];
    body._template = "table";
    send.disabled = true; st.textContent = "جارٍ الإرسال…";
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + DATA.formTo, {method: "POST",
        headers: {"Content-Type": "application/json", "Accept": "application/json"}, body: JSON.stringify(body)});
      const j = await r.json().catch(() => ({}));
      if (!r.ok || String(j.success) === "false") throw new Error(j.message || r.status);
      form.innerHTML = `<p class="fok" tabindex="-1" id="f-ok">شكراً لك، وصلت رسالتك. سنضيفها في التحديث القادم بإذن الله.</p>
        <button class="btn ghost" type="button" onclick="viewFix()">إرسال رسالة أخرى</button>`;
      document.getElementById("f-ok").focus();
    } catch (err) {
      send.disabled = false;
      st.textContent = "لم تُرسل الرسالة. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.";
    }
  };
}

// ---------- «من أنا؟»: يختار الزائر اسمه فيُحفظ في متصفحه فقط
let ME_MEM = null, ME_LATER_MEM = false, CHOOSING = false;
const ME = {
  get(){ let v = ME_MEM; try { v = localStorage.getItem("bashirab_me") || v; } catch(e){} return v && P[v] ? v : null; },
  set(id){ ME_MEM = id; try { id ? localStorage.setItem("bashirab_me", id) : localStorage.removeItem("bashirab_me"); } catch(e){} },
  later(){ ME_LATER_MEM = true; try { localStorage.setItem("bashirab_me_later", "1"); } catch(e){} },
  isLater(){ let v = ME_LATER_MEM; try { v = v || localStorage.getItem("bashirab_me_later") === "1"; } catch(e){} return v; }
};
// صلة X بك (بصيغة المخاطب). ca: من الجد المشترك إليك، cb: إلى X
function youLabel(ca, cb){
  const me = P[ca[ca.length-1]], X = P[cb[cb.length-1]];
  const da = ca.length - 1, db = cb.length - 1;
  const ab = (p, m, f) => isF(p) ? f : m;
  const myPar = P[ca[ca.length-2]];
  const myUp = (a, n) => a.id === ROOT && n > 2 ? "جدك الأكبر" : n === 1 ? ab(a,"والدك","والدتك") : n === 2 ? ab(a,"جدك","جدتك")
    : n === 3 ? `${ab(a,"جد","جدة")} ${ab(myPar,"والدك","والدتك")}` : "من أجدادك";
  const down = (x, n) => n === 1 ? ab(x,"ابن","بنت") : n === 2 ? ab(x,"حفيد","حفيدة") : "من ذرية";
  const kinYou = (myPar, xPar) => isM(myPar) ? (isM(xPar) ? "عمك" : "عمتك") : (isM(xPar) ? "خالك" : "خالتك");
  const kinW = (aPar, xPar) => isM(aPar) ? (isM(xPar) ? "عم" : "عمة") : (isM(xPar) ? "خال" : "خالة");
  if (da === 0) return db === 1 ? ab(X,"ابنك","بنتك") : db === 2 ? ab(X,"حفيدك","حفيدتك") : "من ذريتك";
  if (db === 0) return myUp(X, da);
  if (da === 1 && db === 1) {
    const sf = me.father && me.father === X.father, sm = me.mother && me.mother === X.mother;
    return ab(X,"أخوك","أختك") + (sf && sm ? ab(X," الشقيق"," الشقيقة") : sf ? " من الأب" : " من الأم");
  }
  if (da === 1) { const S = P[cb[1]]; return `${down(X, db-1)} ${ab(S,"أخيك","أختك")} ${S.name}`; }
  if (db === 1) { const A = P[ca[1]]; return da === 2 ? kinYou(A, X) : da === 3 ? `${ab(X,"أخو","أخت")} ${myUp(A, 2)} ${A.name}` : `${ab(X,"أخو","أخت")} ${A.name}، ${myUp(A, da-1)}`; }
  if (da === 2 && db === 2) return `${ab(X,"ابن","بنت")} ${kinYou(P[ca[1]], P[cb[1]])} ${P[cb[1]].name}`;
  if (da === 2) { const C = P[cb[2]]; return `${down(X, db-2)} ${C.name}، ${ab(C,"ابن","بنت")} ${kinYou(P[ca[1]], P[cb[1]])}`; }
  if (db === 2) { const A = P[ca[2]]; return `${ab(X,"ابن","بنت")} ${kinW(P[ca[1]], P[cb[1]])} ${myUp(A, da-2)} ${A.name}`; }
  if (da === 3 && db === 3) { const Y = P[cb[2]]; return `${ab(X,"ابن","بنت")} ${Y.name}، ${ab(Y,"ابن","بنت")} ${kinW(P[ca[1]], P[cb[1]])} ${ab(myPar,"والدك","والدتك")}`; }
  const n = Math.min(da, db) - 1, ord = ["","الأولى","الثانية","الثالثة","الرابعة","الخامسة"][n] || AR(n);
  return `${ab(X,"قريبك","قريبتك")} من الدرجة ${ord}، تلتقيان في ${P[cb[0]].name}`;
}
function meBox(p){
  const me = ME.get();
  if (!me) return "";
  if (me === p.id) return `<div class="mebox"><div class="mel">هذه صفحتك</div></div>`;
  const lines = [];
  if (spouseOf(P[me]).some(x => x.id === p.id)) lines.push(ab2(p, "زوجك", "زوجتك"));
  const conns = relConnections(me, p.id), seen = new Set(lines);
  const rel = [];
  for (const c of conns) {
    const l = youLabel(c.ca, c.cb);
    const sd = c.ca.length > 1 ? (isM(P[c.ca[c.ca.length-2]]) ? "من جهة أبيك" : "من جهة أمك") : "";
    if (seen.has(l) || rel.some(r => r.side === sd)) continue;   // الأقرب من كل جهة فقط
    seen.add(l);
    rel.push({l, side: c.ca.length > 1 ? (isM(P[c.ca[c.ca.length-2]]) ? "من جهة أبيك" : "من جهة أمك") : ""});
  }
  const multi = new Set(rel.map(r => r.side)).size > 1;
  rel.forEach(r => lines.push((multi && r.side ? `<span class="mside">${r.side}:</span>` : "") + r.l));
  const body = lines.length ? lines.map(l => `<div class="mel">${l.replace(/^(<span class="mside">[^<]*<\/span>)?/, m => m + esc(p.name) + " ")}</div>`).join("")
    : `<div class="mel" style="font-weight:400;font-size:14.5px">لا توجد صلة مسجلة بينك وبين ${isF(p)?"ها":"ه"} بعد</div>`;
  return `<div class="mebox"><div class="melbl">${isF(p)?"صلتها":"صلته"} بك</div>${body}
    ${lines.length ? `<a href="#relation" onclick="REL.a='${me}';REL.b='${p.id}'">التفاصيل والرسم</a>` : ""}</div>`;
}
const ab2 = (p, m, f) => isF(p) ? f : m;
function renderMeBar(view){
  const bar = document.getElementById("mebar"), me = ME.get();
  if (me && !CHOOSING) {
    bar.innerHTML = `<div class="meline"><div class="mewrap">أنت: <a href="${hashOf(me)}">${esc(shortName(P[me], 4))}</a> ·
      <button class="linkbtn" type="button" id="mechange">تغيير</button></div></div>`;
    document.getElementById("mechange").onclick = () => { CHOOSING = true; renderMeBar(view); document.getElementById("mein").focus(); };
    return;
  }
  if (!CHOOSING && (view !== "home" || ME.isLater())) { bar.innerHTML = ""; return; }
  bar.innerHTML = `<div class="mechoose"><div class="panel">
      <h2>${me ? "غيّر اسمك" : "هل أنت من العائلة؟"}</h2>
      <p>اكتب اسمك واختره من القائمة، لترى صلتك بكل شخص في الشجرة. يُحفظ اختيارك في جهازك فقط.</p>
      <div class="row2"><div class="searchbox" id="mesearch"><input id="mein" type="search" placeholder="اكتب اسمك…" autocomplete="off"><div class="results"></div></div>
      <button class="btn ghost" type="button" id="melater">${me ? "إلغاء" : "لاحقاً"}</button>
      ${me ? `<button class="btn ghost" type="button" id="meclear">إزالة اسمي</button>` : ""}</div>
    </div></div>`;
  wireSearch(document.getElementById("mesearch"), pp => { ME.set(pp.id); CHOOSING = false;
    document.getElementById("live").textContent = `أهلاً ${pp.name}. تظهر الآن صلتك في صفحة كل شخص.`; route(); });
  document.getElementById("melater").onclick = () => { if (!me) ME.later(); CHOOSING = false; renderMeBar(view); };
  const cl = document.getElementById("meclear");
  if (cl) cl.onclick = () => { ME.set(null); CHOOSING = false; route(); };
}

function route(){
  const h = location.hash.slice(1);
  let v = "home";
  if (h.startsWith("p-")) { v = "person"; viewPerson(h.slice(2).replace(/-/g, ".")); }
  else if (h === "tree" || h.startsWith("tree-")) { v = "tree"; viewTree(h.slice(5).replace(/-/g, ".")); }
  else if (h === "stats") { v = "stats"; viewStats(); }
  else if (h === "relation") { v = "relation"; viewRelation(); }
  else if (h === "fix") { v = "fix"; viewFix(); }
  else viewHome();
  renderMeBar(v);
  document.querySelectorAll("#nav a").forEach(a => { a.classList.toggle("on", a.dataset.v === v); a.toggleAttribute("aria-current", a.dataset.v === v); });
  const h1 = app.querySelector("h1");
  document.title = (h1 && v !== "home" ? h1.textContent.replace(/رحم(ه|ها) الله/,"").trim() + " · " : "") + "عائلة البشيراب";
  if (FIRST) FIRST = false; else if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus(); }
}
let FIRST = true;
document.getElementById("foot").innerHTML = `عائلة البشيراب · <a href="#" onclick="CHOOSING=true;setTimeout(()=>{renderMeBar('home');document.getElementById('mein').focus()},30)">اعرف صلتك بالعائلة</a> · <a href="#fix">أرسل تصحيحاً أو إضافة</a> · <a href="${DATA.pdf}" download="${esc(DATA.pdfName)}">تحميل الكتاب PDF</a>`;
addEventListener("hashchange", route);
route();
